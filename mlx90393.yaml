---
# NOTE: This package sets the MLX90393 to its factory-default I2C address, 0x0C.
# Adafruit STEMMA QT MLX90393 breakouts shipped since May 2023 are at 0x18
# instead, due to a chip substitution (see https://www.adafruit.com/product/4022).
# If the sensor shows up on an i2c bus scan but "Communication failed" /
# "failed to apply gain" errors follow, override the address in your device
# configuration:
#
#   sensor:
#     - id: !extend ${prefix_id}qmc5883l_id
#       address: 0x18
substitutions:
  axis_x_key: 'x_axis'
  axis_y_key: 'y_axis'
  axis_z_key: 'z_axis'
  # Scale per-sample decay for 10ms polling (2x 5ms) so drift tracking stays ~6 µT/min.
  tracker_decay_rate: '0.001'
logger:
  logs:
    mlx90393: INFO
number:
  - id: !remove ${prefix_id}temperature_offset
sensor:
  - id: !extend ${prefix_id}qmc5883l_id
    platform: mlx90393
    address: 0x0C
    # In ESPHome's mlx90393 component, 5X is highest sensitivity (GAIN_SEL=7)
    # and DIV_1 gives 0.150/0.242 µT/LSB over ±4915/±7930 µT (vs. 6.01/9.68 µT/LSB
    # at 1X + DIV_8). oversampling=0 + filter=3 lowers blocking conversion delay
    # from 17 ms to 2 ms so 10 ms (~100 Hz) polling runs cleanly.
    gain: 5X
    oversampling: 0
    filter: 3
    update_interval: 10ms
    x_axis:
      resolution: DIV_1
      accuracy_decimals: 1
    y_axis:
      resolution: DIV_1
      accuracy_decimals: 1
    z_axis:
      resolution: DIV_1
      accuracy_decimals: 1
