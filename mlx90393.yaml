---
# NOTE: This package sets the MLX90393 to its factory-default I2C address, 0x0C.
# Adafruit STEMMA QT MLX90393 breakouts shipped since May 2023 are at 0x18
# instead, due to a chip substitution (see https://www.adafruit.com/product/4022).
# If the sensor shows up on an i2c bus scan but "Communication failed" /
# "failed to apply gain" errors follow, override the address in your device
# configuration:
#
#   sensor:
#     - id: !extend ${prefix_id}qmc5883l_id
#       address: 0x18
substitutions:
  axis_x_key: 'x_axis'
  axis_y_key: 'y_axis'
  axis_z_key: 'z_axis'
logger:
  logs:
    mlx90393: INFO
number:
  - id: !remove ${prefix_id}temperature_offset
sensor:
  - id: !extend ${prefix_id}qmc5883l_id
    platform: mlx90393
    address: 0x0C
    oversampling: 1
    filter: 5
    temperature: !remove ${prefix_id}qmc5883l_temperature
    x_axis:
      resolution: DIV_8
    y_axis:
      resolution: DIV_8
    z_axis:
      resolution: DIV_8
