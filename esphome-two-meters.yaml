---
substitutions:
  device_class1: 'water'
  device_class2: 'gas'

  device_icon1: 'mdi:water'
  device_icon2: 'mdi:meter-gas'

  volume_unit1: 'gal'
  volume_unit2: 'ft³'

  prefix1_name: 'Water '
  prefix1_id: 'water_'
  prefix2_name: 'Gas '
  prefix2_id: 'gas_'

  gpio_led: GPIO2

  # Bus 1 matches the single-meter default and the README wiring table (D2/D1).
  # Bus 2 uses D7/D5. GPIO12 is deliberately avoided: it is the ESP32 MTDI
  # strapping pin that selects flash voltage at reset, and since I2C requires
  # pull-up resistors the line would be held high at boot, which stops most
  # ESP32 modules (3.3V flash) from booting at all.
  i2c1_sda: GPIO4   # D2
  i2c1_scl: GPIO5   # D1
  i2c2_sda: GPIO13  # D7
  i2c2_scl: GPIO14  # D5

  flow_update_interval_seconds1: '10'
  flow_update_interval_seconds2: '30'

  # Defaults below mirror esphome-water-meter.yaml (meter1) and
  # esphome-gas-meter.yaml (meter2). Adjust per meter as needed.
  volume_per_half_rotation_initial_value1: '0.01008156'
  volume_per_half_rotation_initial_value2: '0.125'
  calibration_minimal_axis_range_initial_value1: '20'
  calibration_minimal_axis_range_initial_value2: '15'
  magnetic_field_update_delta1: '3'
  magnetic_field_update_delta2: '1'

packages:
  meter1: !include
    file: esphome-magnetometer.yaml
    vars:
      device_class: ${device_class1}
      device_icon: ${device_icon1}
      volume_unit: ${volume_unit1}
      prefix_name: ${prefix1_name}
      prefix_id: ${prefix1_id}
      i2c_sda: ${i2c1_sda}
      i2c_scl: ${i2c1_scl}
      flow_update_interval_seconds: ${flow_update_interval_seconds1}
      volume_per_half_rotation_initial_value: ${volume_per_half_rotation_initial_value1}
      calibration_minimal_axis_range_initial_value: ${calibration_minimal_axis_range_initial_value1}
      magnetic_field_update_delta: ${magnetic_field_update_delta1}
  meter2: !include
    file: esphome-magnetometer.yaml
    vars:
      device_class: ${device_class2}
      device_icon: ${device_icon2}
      volume_unit: ${volume_unit2}
      prefix_name: ${prefix2_name}
      prefix_id: ${prefix2_id}
      i2c_sda: ${i2c2_sda}
      i2c_scl: ${i2c2_scl}
      flow_update_interval_seconds: ${flow_update_interval_seconds2}
      volume_per_half_rotation_initial_value: ${volume_per_half_rotation_initial_value2}
      calibration_minimal_axis_range_initial_value: ${calibration_minimal_axis_range_initial_value2}
      magnetic_field_update_delta: ${magnetic_field_update_delta2}

switch:
  # LED flashes faster/slower as the magnets rotate on either meter
  - platform: gpio
    id: led
    restore_mode: ALWAYS_OFF
    pin:
      number: ${gpio_led}
      inverted: true
