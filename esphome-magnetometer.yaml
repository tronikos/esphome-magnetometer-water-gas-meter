---
# This config uses the QMC5883L, a triple-axis magnetometer, to read your water meter or gas meter.
#
# This package is not standalone: it expects a `switch` with `id: led` to be defined by the
# including config, so including it directly fails with "Couldn't find ID 'led'". Use
# esphome-water-meter.yaml, esphome-gas-meter.yaml, or esphome-two-meters.yaml instead.
# The LED cannot live in here because esphome-two-meters.yaml includes this file twice.

substitutions:
  # water or gas
  device_class: 'water'

  # mdi:water or mdi:meter-gas
  device_icon: 'mdi:water'

  # For water one of: CCF, ft³, gal, L, m³
  # For gas one of: CCF, ft³, m³
  volume_unit: 'gal'

  i2c_scl: GPIO5  # D1
  i2c_sda: GPIO4  # D2
  i2c_frequency: 50kHz
  i2c_scan: false
  i2c_address: 0x0D

  # Set these only if you have connected two QMC5883L to one device, see esphome-two-meters.yaml
  prefix_name: ''
  prefix_id: ''

  qmc5883l_update_interval: '5ms'
  qmc5883l_oversampling: '64x'

  # 3/4" Badger Recordall 35 RCDL: 2/126.671 pulses per gallon. This is only the author's
  # meter; the value varies by make, model and size, so look yours up or measure it. See the
  # README section on volume per half rotation.
  volume_per_half_rotation_initial_value: '0.01578893'
  calibration_minimal_axis_range_initial_value: '20'
  # How often Flow is recomputed and published.
  flow_update_interval_seconds: '10'

  # Only publish updates if the magnetic field changes by at least this amount (in µT).
  # Reduces Wi-Fi traffic and Home Assistant database growth.
  magnetic_field_update_delta: '3'

  hide_magnetic_field_strength_sensors: 'true'
  hide_half_rotations_total_sensor: 'true'

  # Override these to change the axis key names (e.g. for MLX90393: x_axis, y_axis, z_axis)
  axis_x_key: 'field_strength_x'
  axis_y_key: 'field_strength_y'
  axis_z_key: 'field_strength_z'

  # Tuning parameters for the Min/Max Tracker algorithm:
  # Decay rate per axis_value update, whose rate is MCU-dependent (see the esphome:
  # comment below): 5ms on ESP32, 8ms on ESP8266. Controls how fast the tracker
  # follows thermal drift. 0.0005 = ~6 µT/min on ESP32, ~3.75 µT/min on ESP8266.
  # Increase if you see false triggers from temperature changes.
  tracker_decay_rate: '0.0005'
  # Minimum span as fraction of calibrated magnet_span. Keeps the detection window
  # open when flow stops, ensuring slow leaks are still detected.
  # 0.8 = window stays at 80% of calibrated size.
  min_span_multiplier: '0.8'
  # Maximum span as fraction of calibrated magnet_span.
  # If the calculated span exceeds this (e.g., due to bad initialization or huge signal jump),
  # the opposite tracker is dragged along to maintain the maximum allowed size.
  # 1.2 = Max allowed window is 120% of calibrated size.
  max_span_multiplier: '1.2'

  # Silence before Flow reads zero, as bounds on 2.5x the median interval. The floor
  # keeps a sharp deceleration from being read as a stop; the ceiling bounds how long
  # Flow stays non-zero after the meter really stops.
  min_silence_seconds: '15'
  max_silence_seconds: '60'
  # A water leak runs ~0.0003 gal/min, so Flow needs more digits than volume does.
  flow_accuracy_decimals: '4'
  # Calibration must span at least one full magnet rotation. Water meters rotate in
  # seconds; a gas index can take minutes, so the gas package raises this.
  calibration_seconds_initial_value: '5'

esphome:
  min_version: "2026.1.0"
  # Default loop interval is 16ms. Setting it to 0 to make updates faster.
  # Without setting this, the actual update interval of qmc5883l is: 6ms on ESP32, 10ms on ESP8266.
  # With this, it's 5ms on ESP32, 8ms on ESP8266.
  on_boot:
    then:
      - lambda: App.set_loop_interval(0);

logger:
  level: INFO
  logs:
    qmc5883l: INFO

api:
  services:
    # Based on https://esphome.io/components/sensor/pulse_meter.html#re-setting-the-total-pulse-count
    # Useful if you would like the total sensor to match what you see on your meter.
    - service: ${prefix_id}set_total
      variables:
        new_total: float
      then:
        # Anchor the offset so Total lands on new_total, leaving the counter alone.
        # The counter stays a true half-rotation count, so adjusting
        # volume_per_half_rotation afterwards revalues only the volume actually
        # measured, not the reading this anchored to.
        - globals.set:
            id: ${prefix_id}volume_offset
            value: !lambda |-
              float volume = id(${prefix_id}volume_per_half_rotation).state;
              if (std::isnan(volume)) {
                ESP_LOGW("${prefix_id}set_total", "Volume per half rotation is NaN, ignoring set_total");
                return id(${prefix_id}volume_offset);
              }
              id(${prefix_id}quad_total_max) = NAN;
              id(${prefix_id}quad_net_max) =
                  (long) id(${prefix_id}half_rotations_total) * 4L + id(${prefix_id}quad_steps);
              return new_total - id(${prefix_id}half_rotations_total) * volume;

globals:
  - id: ${prefix_id}half_rotations_total
    type: long
    restore_value: true
    initial_value: '0'
  - id: ${prefix_id}volume_offset
    type: float
    restore_value: true
    initial_value: '0'

  # Pulse timing for the flow estimator.
  # iv0/iv1/iv2 are the three most recent half-rotation intervals in ms, newest first.
  - id: ${prefix_id}last_pulse_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: ${prefix_id}iv0
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: ${prefix_id}iv1
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: ${prefix_id}iv2
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: ${prefix_id}axis_value_high
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: ${prefix_id}sensor_alive
    type: bool
    restore_value: false
    initial_value: 'true'
  - id: ${prefix_id}calibrating
    type: bool
    restore_value: false
    initial_value: 'false'

  # TRACKERS for Min/Max Algorithm (initialized to NAN, set on first reading)
  - id: ${prefix_id}track_min
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: ${prefix_id}track_max
    type: float
    restore_value: false
    initial_value: 'NAN'

  # 3-Axis Quadrature state:
  # Latest raw burst readings [x, y, z] and per-axis adaptive trackers
  - id: ${prefix_id}raw_axes
    type: float[3]
    restore_value: false
    initial_value: '{0, 0, 0}'
  - id: ${prefix_id}quad_trk_min
    type: float[3]
    restore_value: false
    initial_value: '{NAN, NAN, NAN}'
  - id: ${prefix_id}quad_trk_max
    type: float[3]
    restore_value: false
    initial_value: '{NAN, NAN, NAN}'
  # Calibrated per-axis spans and 3D Gram-Schmidt / MRC projection weights (restored across reboots):
  # quad_c[i]: in-phase correlation of axis i with primary axis p
  # quad_s[i]: signed quadrature sin(phi_i) component of axis i
  # quad_w[i]: Maximal-Ratio Combining weight for extracting Q = sin(theta) from secondary axes
  # quad_wi[i]: Maximal-Ratio Combining weight for extracting I = cos(theta) from all 3 axes
  - id: ${prefix_id}quad_span
    type: float[3]
    restore_value: true
    initial_value: '{NAN, NAN, NAN}'
  - id: ${prefix_id}quad_c
    type: float[3]
    restore_value: true
    initial_value: '{0, 0, 0}'
  - id: ${prefix_id}quad_s
    type: float[3]
    restore_value: true
    initial_value: '{0, 0, 0}'
  - id: ${prefix_id}quad_w
    type: float[3]
    restore_value: true
    initial_value: '{0, 0, 0}'
  - id: ${prefix_id}quad_wi
    type: float[3]
    restore_value: true
    initial_value: '{0, 0, 0}'
  - id: ${prefix_id}quad_i_high
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: ${prefix_id}quad_q_high
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: ${prefix_id}quad_state
    type: int
    restore_value: false
    initial_value: '-1'
  - id: ${prefix_id}quad_steps
    type: int
    restore_value: false
    initial_value: '0'
  - id: ${prefix_id}quad_net_max
    type: long
    restore_value: false
    initial_value: '-2147483647'
  - id: ${prefix_id}quad_t
    type: uint32_t[4]
    restore_value: false
    initial_value: '{0, 0, 0, 0}'
  - id: ${prefix_id}quad_reverse_total
    type: long
    restore_value: false
    initial_value: '0'
  # High-water mark of published Total so reverse ticks never cause a decrease on a
  # total_increasing sensor in Home Assistant. Released by set_total and volume changes.
  - id: ${prefix_id}quad_total_max
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: ${prefix_id}volume_per_half_rotation_prev
    type: float
    restore_value: false
    initial_value: 'NAN'

  # Calibration Vars (min/max and single-pass centered covariance + shoelace area)
  - id: ${prefix_id}calibrating_axis_x_min
    type: float
    restore_value: false
  - id: ${prefix_id}calibrating_axis_x_max
    type: float
    restore_value: false
  - id: ${prefix_id}calibrating_axis_y_min
    type: float
    restore_value: false
  - id: ${prefix_id}calibrating_axis_y_max
    type: float
    restore_value: false
  - id: ${prefix_id}calibrating_axis_z_min
    type: float
    restore_value: false
  - id: ${prefix_id}calibrating_axis_z_max
    type: float
    restore_value: false
  - id: ${prefix_id}cal_n
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: ${prefix_id}cal_origin
    type: float[3]
    restore_value: false
    initial_value: '{0, 0, 0}'
  - id: ${prefix_id}cal_prev
    type: float[3]
    restore_value: false
    initial_value: '{0, 0, 0}'
  - id: ${prefix_id}cal_sum
    type: float[3]
    restore_value: false
    initial_value: '{0, 0, 0}'
  - id: ${prefix_id}cal_sum2
    type: float[3]
    restore_value: false
    initial_value: '{0, 0, 0}'
  - id: ${prefix_id}cal_cross
    type: float[3]
    restore_value: false
    initial_value: '{0, 0, 0}'
  - id: ${prefix_id}cal_area
    type: float[3]
    restore_value: false
    initial_value: '{0, 0, 0}'

number:
  - platform: template
    id: ${prefix_id}volume_per_half_rotation
    name: ${prefix_name}Volume per half rotation
    entity_category: config
    mode: box
    min_value: 0
    max_value: 9999999
    step: 0.000000001
    initial_value: ${volume_per_half_rotation_initial_value}
    update_interval: never
    restore_value: true
    optimistic: true
    unit_of_measurement: ${volume_unit}
    icon: mdi:rotate-360
    on_value:
      then:
        - lambda: |-
            if (!std::isnan(id(${prefix_id}volume_per_half_rotation_prev))) {
              id(${prefix_id}quad_total_max) = NAN;
            }
            id(${prefix_id}volume_per_half_rotation_prev) = x;

  - platform: template
    id: ${prefix_id}temperature_offset
    name: ${prefix_name}Temperature Offset
    unit_of_measurement: '°C'
    min_value: -100
    max_value: 100
    step: 0.1
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 33
    icon: 'mdi:thermometer'
    entity_category: config
    disabled_by_default: true

  - platform: template
    id: ${prefix_id}magnet_span
    name: ${prefix_name}Magnet Span
    entity_category: config
    disabled_by_default: true
    mode: box
    min_value: 1.0
    max_value: 2000
    step: 0.1
    initial_value: 40.0
    update_interval: never
    restore_value: true
    optimistic: true
    unit_of_measurement: µT
    icon: mdi:arrow-expand-vertical

  - platform: template
    id: ${prefix_id}threshold_lower
    name: ${prefix_name}Threshold lower
    entity_category: config
    disabled_by_default: true
    mode: box
    min_value: -9999
    max_value: 9999
    step: 0.1
    initial_value: -9999
    update_interval: never
    restore_value: true
    optimistic: true
    unit_of_measurement: µT
    icon: mdi:arrow-collapse-down

  - platform: template
    id: ${prefix_id}threshold_upper
    name: ${prefix_name}Threshold upper
    entity_category: config
    disabled_by_default: true
    mode: box
    min_value: -9999
    max_value: 9999
    step: 0.1
    initial_value: 9999
    update_interval: never
    restore_value: true
    optimistic: true
    unit_of_measurement: µT
    icon: mdi:arrow-collapse-up

  - platform: template
    id: ${prefix_id}calibration_minimal_axis_range
    name: ${prefix_name}Calibration minimal axis range
    entity_category: config
    icon: mdi:sine-wave
    mode: box
    min_value: 10
    max_value: 20
    step: 1
    initial_value: ${calibration_minimal_axis_range_initial_value}
    update_interval: never
    restore_value: true
    optimistic: true
    unit_of_measurement: µT

  - platform: template
    id: ${prefix_id}calibration_seconds
    name: ${prefix_name}Calibration time
    entity_category: config
    icon: mdi:timer
    mode: box
    min_value: 1
    max_value: 999
    step: 1
    initial_value: ${calibration_seconds_initial_value}
    update_interval: never
    restore_value: true
    optimistic: true
    unit_of_measurement: s

select:
  - platform: template
    id: ${prefix_id}axis
    name: ${prefix_name}Axis
    entity_category: config
    icon: mdi:axis-arrow
    options:
      - x
      - y
      - z
      - None
    initial_option: None
    update_interval: never
    restore_value: true
    optimistic: true
    on_value:
      then:
        - lambda: |-
            id(${prefix_id}track_max) = NAN;
            id(${prefix_id}track_min) = NAN;
            for (int i = 0; i < 3; i++) {
              id(${prefix_id}quad_trk_max)[i] = NAN;
              id(${prefix_id}quad_trk_min)[i] = NAN;
            }
            id(${prefix_id}quad_state) = -1;
            id(${prefix_id}quad_steps) = 0;
            if (x == "None") {
              id(${prefix_id}calibration_status).publish_state("Not Calibrated");
            } else if (!id(${prefix_id}calibrating)) {
              id(${prefix_id}calibration_status).publish_state("Ready");
            }

  - platform: template
    id: ${prefix_id}detection_algorithm
    name: ${prefix_name}Detection algorithm
    entity_category: config
    icon: mdi:auto-fix
    options:
      - Adaptive
      - Threshold
      - Quadrature
    initial_option: Quadrature
    update_interval: never
    restore_value: true
    optimistic: true
    on_value:
      then:
        - lambda: |-
            id(${prefix_id}quad_state) = -1;
            id(${prefix_id}quad_steps) = 0;
            id(${prefix_id}quad_net_max) = (long) id(${prefix_id}half_rotations_total) * 4L;

text_sensor:
  - platform: template
    id: ${prefix_id}calibration_status
    name: ${prefix_name}Calibration Status
    entity_category: diagnostic
    icon: mdi:information-outline
    update_interval: never

  - platform: template
    id: ${prefix_id}flow_direction
    name: ${prefix_name}Flow Direction
    entity_category: diagnostic
    icon: mdi:swap-horizontal
    update_interval: never

binary_sensor:
  - platform: template
    id: ${prefix_id}magnetometer_problem
    name: ${prefix_name}Magnetometer Problem
    device_class: problem
    entity_category: diagnostic

button:
  - platform: template
    id: ${prefix_id}calibrate_button
    name: ${prefix_name}Calibrate axis
    entity_category: config
    icon: mdi:tune
    on_press:
      - lambda: |-
          ESP_LOGI("${prefix_id}calibration", "Starting calibration. Make sure ${device_class} is running");
          id(${prefix_id}calibration_status).publish_state("Calibrating...");
          id(${prefix_id}calibrating_axis_x_min) = std::numeric_limits<float>::max();
          id(${prefix_id}calibrating_axis_x_max) = std::numeric_limits<float>::lowest();
          id(${prefix_id}calibrating_axis_y_min) = std::numeric_limits<float>::max();
          id(${prefix_id}calibrating_axis_y_max) = std::numeric_limits<float>::lowest();
          id(${prefix_id}calibrating_axis_z_min) = std::numeric_limits<float>::max();
          id(${prefix_id}calibrating_axis_z_max) = std::numeric_limits<float>::lowest();
          id(${prefix_id}cal_n) = 0;
          for (int i = 0; i < 3; i++) {
            id(${prefix_id}cal_sum)[i] = 0.0f;
            id(${prefix_id}cal_sum2)[i] = 0.0f;
            id(${prefix_id}cal_cross)[i] = 0.0f;
            id(${prefix_id}cal_area)[i] = 0.0f;
          }
          id(${prefix_id}calibrating) = true;
      - delay: !lambda return id(${prefix_id}calibration_seconds).state * 1000;
      - lambda: |-
          id(${prefix_id}calibrating) = false;
          float x_range = id(${prefix_id}calibrating_axis_x_max) - id(${prefix_id}calibrating_axis_x_min);
          float y_range = id(${prefix_id}calibrating_axis_y_max) - id(${prefix_id}calibrating_axis_y_min);
          float z_range = id(${prefix_id}calibrating_axis_z_max) - id(${prefix_id}calibrating_axis_z_min);
          float min_axis_range = id(${prefix_id}calibration_minimal_axis_range).state;
          // Log diagnostic info for each axis
          if (x_range < 0) {
            ESP_LOGW("${prefix_id}calibration", "Didn't get any values for x");
          } else {
            ESP_LOGI("${prefix_id}calibration", "x ranged from %.2f to %.2f (range: %.2f)",
                     id(${prefix_id}calibrating_axis_x_min), id(${prefix_id}calibrating_axis_x_max), x_range);
          }
          if (y_range < 0) {
            ESP_LOGW("${prefix_id}calibration", "Didn't get any values for y");
          } else {
            ESP_LOGI("${prefix_id}calibration", "y ranged from %.2f to %.2f (range: %.2f)",
                     id(${prefix_id}calibrating_axis_y_min), id(${prefix_id}calibrating_axis_y_max), y_range);
          }
          if (z_range < 0) {
            ESP_LOGW("${prefix_id}calibration", "Didn't get any values for z");
          } else {
            ESP_LOGI("${prefix_id}calibration", "z ranged from %.2f to %.2f (range: %.2f)",
                     id(${prefix_id}calibrating_axis_z_min), id(${prefix_id}calibrating_axis_z_max), z_range);
          }
          const char *axis_names[3] = {"x", "y", "z"};
          float mins[3] = {
            id(${prefix_id}calibrating_axis_x_min),
            id(${prefix_id}calibrating_axis_y_min),
            id(${prefix_id}calibrating_axis_z_min),
          };
          float maxs[3] = {
            id(${prefix_id}calibrating_axis_x_max),
            id(${prefix_id}calibrating_axis_y_max),
            id(${prefix_id}calibrating_axis_z_max),
          };
          float ranges[3] = {x_range, y_range, z_range};
          int p = 0;
          if (ranges[1] > ranges[p]) p = 1;
          if (ranges[2] > ranges[p]) p = 2;
          if (ranges[p] <= min_axis_range) {
            ESP_LOGE("${prefix_id}calibration", "Calibration failed. No axis had a range of at least %.0f", min_axis_range);
            id(${prefix_id}calibration_status).publish_state("Failed: low signal");
            return;
          }
          std::string axis_with_largest_range = axis_names[p];
          float min = mins[p];
          float max = maxs[p];
          float max_range_found = ranges[p];

          id(${prefix_id}axis).make_call().set_option(axis_with_largest_range).perform();

          // Set magnet span for adaptive algorithm
          id(${prefix_id}magnet_span).make_call().set_value(roundf(max_range_found * 10) / 10).perform();
          id(${prefix_id}track_max) = NAN;
          id(${prefix_id}track_min) = NAN;

          // Compute 3-axis Quadrature spans and Gram-Schmidt / Maximal-Ratio Combining weights
          float inv_n = (id(${prefix_id}cal_n) > 1) ? (1.0f / id(${prefix_id}cal_n)) : 0.0f;
          float mean[3] = {
            id(${prefix_id}cal_sum)[0] * inv_n,
            id(${prefix_id}cal_sum)[1] * inv_n,
            id(${prefix_id}cal_sum)[2] * inv_n,
          };
          float var[3];
          for (int i = 0; i < 3; i++) {
            float v = id(${prefix_id}cal_sum2)[i] * inv_n - mean[i] * mean[i];
            var[i] = (v > 0.0f) ? v : 0.0f;
            id(${prefix_id}quad_span)[i] = (ranges[i] > 1.0f) ? (roundf(ranges[i] * 10) / 10) : 1.0f;
            id(${prefix_id}quad_trk_max)[i] = NAN;
            id(${prefix_id}quad_trk_min)[i] = NAN;
          }
          float cov[3][3] = {};
          cov[0][1] = cov[1][0] = id(${prefix_id}cal_cross)[0] * inv_n - mean[0] * mean[1];
          cov[0][2] = cov[2][0] = id(${prefix_id}cal_cross)[1] * inv_n - mean[0] * mean[2];
          cov[1][2] = cov[2][1] = id(${prefix_id}cal_cross)[2] * inv_n - mean[1] * mean[2];
          // Exact mean-centered shoelace areas via telescoping boundary correction
          float area[3][3] = {};
          area[0][1] = id(${prefix_id}cal_area)[0] - mean[0] * id(${prefix_id}cal_prev)[1] + mean[1] * id(${prefix_id}cal_prev)[0];
          area[1][0] = -area[0][1];
          area[0][2] = id(${prefix_id}cal_area)[1] - mean[0] * id(${prefix_id}cal_prev)[2] + mean[2] * id(${prefix_id}cal_prev)[0];
          area[2][0] = -area[0][2];
          area[1][2] = id(${prefix_id}cal_area)[2] - mean[1] * id(${prefix_id}cal_prev)[2] + mean[2] * id(${prefix_id}cal_prev)[1];
          area[2][1] = -area[1][2];

          float snr[3] = {};
          float denom_q = 0.0f;
          float denom_i = 0.0f;
          float eff_quad_sq = 0.0f;
          for (int i = 0; i < 3; i++) {
            float rel = (ranges[i] > 0.0f) ? (ranges[i] / max_range_found) : 0.0f;
            snr[i] = rel * rel;
            if (i == p) {
              id(${prefix_id}quad_c)[i] = 1.0f;
              id(${prefix_id}quad_s)[i] = 0.0f;
            } else if (ranges[i] >= min_axis_range * 0.25f && var[p] > 0.0f && var[i] > 0.0f) {
              float r = cov[p][i] / sqrtf(var[p] * var[i]);
              if (r > 0.98f) r = 0.98f;
              if (r < -0.98f) r = -0.98f;
              float s_mag = sqrtf(1.0f - r * r);
              float s_sign = (area[p][i] >= 0.0f) ? 1.0f : -1.0f;
              id(${prefix_id}quad_c)[i] = r;
              id(${prefix_id}quad_s)[i] = s_sign * s_mag;
              denom_q += snr[i] * s_mag * s_mag;
              eff_quad_sq += ranges[i] * ranges[i] * s_mag * s_mag;
            } else {
              id(${prefix_id}quad_c)[i] = 0.0f;
              id(${prefix_id}quad_s)[i] = 0.0f;
              snr[i] = 0.0f;
            }
            denom_i += snr[i] * id(${prefix_id}quad_c)[i] * id(${prefix_id}quad_c)[i];
          }
          bool quad_ok = sqrtf(eff_quad_sq) >= min_axis_range * 0.25f && denom_q > 1e-4f;
          for (int i = 0; i < 3; i++) {
            id(${prefix_id}quad_w)[i] = (i != p && quad_ok)
                ? (snr[i] * id(${prefix_id}quad_s)[i] / denom_q) : 0.0f;
            id(${prefix_id}quad_wi)[i] = (denom_i > 1e-4f)
                ? (snr[i] * id(${prefix_id}quad_c)[i] / denom_i) : ((i == p) ? 1.0f : 0.0f);
          }
          if (!quad_ok) {
            ESP_LOGW("${prefix_id}calibration",
                     "Insufficient quadrature signal on secondary axes (quad_eff_span=%.2f); falling back to Adaptive",
                     sqrtf(eff_quad_sq));
          }
          id(${prefix_id}quad_state) = -1;
          id(${prefix_id}quad_steps) = 0;
          id(${prefix_id}quad_net_max) = (long) id(${prefix_id}half_rotations_total) * 4L;

          // Set thresholds for threshold-based algorithm
          // ±5 µT of tolerance, scaled from the reference range of 20 (i.e. min_axis_range / 4).
          float tolerance = 5 / (20.0 / min_axis_range);
          float lower_threshold = min + (max - min) / 2 - tolerance;
          float upper_threshold = min + (max - min) / 2 + tolerance;
          id(${prefix_id}threshold_lower).make_call().set_value(roundf(lower_threshold * 10) / 10).perform();
          id(${prefix_id}threshold_upper).make_call().set_value(roundf(upper_threshold * 10) / 10).perform();

          ESP_LOGI("${prefix_id}calibration",
                   "Calibration complete: axis=%s, span=%.2f, quad_eff_span=%.2f, thresholds=[%.1f, %.1f]",
                   axis_with_largest_range.c_str(), max_range_found, sqrtf(eff_quad_sq),
                   lower_threshold, upper_threshold);

i2c:
  - id: ${prefix_id}i2c_bus
    scl: ${i2c_scl}
    sda: ${i2c_sda}
    frequency: ${i2c_frequency}
    scan: ${i2c_scan}

sensor:
  # Holds the magnetic field strength value of x, y, or z depending on the axis template select.
  # Increments counters when value crosses thresholds.
  - platform: template
    id: ${prefix_id}axis_value
    internal: true
    on_value:
      then:
        - lambda: |-
            // Quadrature is evaluated once per x->y->z burst on the z-axis callback below.
            // If Quadrature is selected before 3-axis calibration (or secondary axes lack signal),
            // automatically fall back to 1-axis Adaptive on the selected primary axis.
            bool quad_ready = id(${prefix_id}quad_w)[0] != 0.0f ||
                              id(${prefix_id}quad_w)[1] != 0.0f ||
                              id(${prefix_id}quad_w)[2] != 0.0f;
            if (id(${prefix_id}detection_algorithm).current_option() == "Quadrature" && quad_ready) return;
            if (id(${prefix_id}detection_algorithm).current_option() != "Threshold") {
              // === ADAPTIVE ALGORITHM: Min/Max Tracker with Range Clamping ===

              // 1. Initialize Trackers if empty (NAN on boot or after calibration)
              if (std::isnan(id(${prefix_id}track_max)) || std::isnan(id(${prefix_id}track_min))) {
                 id(${prefix_id}track_max) = x + (id(${prefix_id}magnet_span).state / 2.0);
                 id(${prefix_id}track_min) = x - (id(${prefix_id}magnet_span).state / 2.0);
              }

              // 2. Linear Decay (Very Slow) - pulls max down and min up to follow thermal drift
              float decay = ${tracker_decay_rate};
              id(${prefix_id}track_max) -= decay;
              id(${prefix_id}track_min) += decay;

              // 3. Expand Trackers based on current signal AND Clamp Span
              float max_allowed_span = id(${prefix_id}magnet_span).state * ${max_span_multiplier};

              if (x > id(${prefix_id}track_max)) {
                id(${prefix_id}track_max) = x;
                // If expanding Max makes the window too huge, drag Min up
                if ((id(${prefix_id}track_max) - id(${prefix_id}track_min)) > max_allowed_span) {
                   id(${prefix_id}track_min) = id(${prefix_id}track_max) - max_allowed_span;
                }
              }
              if (x < id(${prefix_id}track_min)) {
                id(${prefix_id}track_min) = x;
                // If expanding Min makes the window too huge, drag Max down
                if ((id(${prefix_id}track_max) - id(${prefix_id}track_min)) > max_allowed_span) {
                   id(${prefix_id}track_max) = id(${prefix_id}track_min) + max_allowed_span;
                }
              }

              // 4. Enforce Minimum Span - prevents window from collapsing when flow stops
              float min_span = id(${prefix_id}magnet_span).state * ${min_span_multiplier};
              float current_span = id(${prefix_id}track_max) - id(${prefix_id}track_min);

              if (current_span < min_span) {
                 float correction = (min_span - current_span) / 2.0;
                 id(${prefix_id}track_max) += correction;
                 id(${prefix_id}track_min) -= correction;
              }

              // 5. Calculate Center and Hysteresis (25% of window size)
              float midpoint = (id(${prefix_id}track_max) + id(${prefix_id}track_min)) / 2.0;
              float hyst = (id(${prefix_id}track_max) - id(${prefix_id}track_min)) * 0.25;

              // 6. Trigger Logic
              if (x > (midpoint + hyst) && !id(${prefix_id}axis_value_high)) {
                id(${prefix_id}axis_value_high) = true;
                id(${prefix_id}half_rotations_total) += 1;
                if (id(${prefix_id}flow_direction).state != "Forward") {
                  id(${prefix_id}flow_direction).publish_state("Forward");
                }
                {
                  // Record the interval for the flow estimator. The total counter above is
                  // never gated on this: a rejected bounce must not lose volume.
                  uint32_t now_ms = millis();
                  if (id(${prefix_id}last_pulse_ms) != 0) {
                    uint32_t dt = now_ms - id(${prefix_id}last_pulse_ms);
                    if (dt >= 10) {  // rejects threshold chatter, still allows ~60 gal/min
                      if (dt > ${max_silence_seconds} * 1000UL) {
                        // Flow was already reported as stopped, so the older intervals are no
                        // longer evidence about the current rate. Keep this gap as the only
                        // sample rather than dropping it: for a slow leak the gap IS the
                        // interval, and discarding it would pin Flow at zero forever.
                        id(${prefix_id}iv1) = 0;
                        id(${prefix_id}iv2) = 0;
                        id(${prefix_id}iv0) = dt;
                      } else {
                        id(${prefix_id}iv2) = id(${prefix_id}iv1);
                        id(${prefix_id}iv1) = id(${prefix_id}iv0);
                        id(${prefix_id}iv0) = dt;
                      }
                    }
                  }
                  id(${prefix_id}last_pulse_ms) = now_ms;
                }
                id(led).turn_on();
              } else if (x < (midpoint - hyst) && id(${prefix_id}axis_value_high)) {
                id(${prefix_id}axis_value_high) = false;
                id(led).turn_off();
              }
              return;
            }
            // === THRESHOLD ALGORITHM: Fixed thresholds ===
            if (x > id(${prefix_id}threshold_upper).state && !id(${prefix_id}axis_value_high)) {
              id(${prefix_id}axis_value_high) = true;
              id(${prefix_id}half_rotations_total) += 1;
              if (id(${prefix_id}flow_direction).state != "Forward") {
                id(${prefix_id}flow_direction).publish_state("Forward");
              }
              {
                // Record the interval for the flow estimator. The total counter above is
                // never gated on this: a rejected bounce must not lose volume.
                uint32_t now_ms = millis();
                if (id(${prefix_id}last_pulse_ms) != 0) {
                  uint32_t dt = now_ms - id(${prefix_id}last_pulse_ms);
                  if (dt >= 10) {  // rejects threshold chatter, still allows ~60 gal/min
                    if (dt > ${max_silence_seconds} * 1000UL) {
                      // Flow was already reported as stopped, so the older intervals are no
                      // longer evidence about the current rate. Keep this gap as the only
                      // sample rather than dropping it: for a slow leak the gap IS the
                      // interval, and discarding it would pin Flow at zero forever.
                      id(${prefix_id}iv1) = 0;
                      id(${prefix_id}iv2) = 0;
                      id(${prefix_id}iv0) = dt;
                    } else {
                      id(${prefix_id}iv2) = id(${prefix_id}iv1);
                      id(${prefix_id}iv1) = id(${prefix_id}iv0);
                      id(${prefix_id}iv0) = dt;
                    }
                  }
                }
                id(${prefix_id}last_pulse_ms) = now_ms;
              }
              id(led).turn_on();
            } else if (x < id(${prefix_id}threshold_lower).state && id(${prefix_id}axis_value_high)) {
              id(${prefix_id}axis_value_high) = false;
              id(led).turn_off();
            }

  # https://esphome.io/components/sensor/qmc5883l.html
  - platform: qmc5883l
    id: ${prefix_id}qmc5883l_id
    i2c_id: ${prefix_id}i2c_bus
    address: ${i2c_address}
    ${axis_x_key}:
      id: ${prefix_id}qmc5883l_axis_x
      name: ${prefix_name}Magnetic Field Strength X
      internal: ${hide_magnetic_field_strength_sensors}
      entity_category: diagnostic
      on_raw_value:
        then:
          - lambda: |-
              id(${prefix_id}raw_axes)[0] = x;
              if (id(${prefix_id}axis).current_option() == "x") id(${prefix_id}axis_value).publish_state(x);
              if (id(${prefix_id}calibrating)) {
                id(${prefix_id}calibrating_axis_x_min) = min(id(${prefix_id}calibrating_axis_x_min), x);
                id(${prefix_id}calibrating_axis_x_max) = max(id(${prefix_id}calibrating_axis_x_max), x);
              }
      filters:
        - delta: ${magnetic_field_update_delta}
    ${axis_y_key}:
      id: ${prefix_id}qmc5883l_axis_y
      name: ${prefix_name}Magnetic Field Strength Y
      internal: ${hide_magnetic_field_strength_sensors}
      entity_category: diagnostic
      on_raw_value:
        then:
          - lambda: |-
              id(${prefix_id}raw_axes)[1] = x;
              if (id(${prefix_id}axis).current_option() == "y") id(${prefix_id}axis_value).publish_state(x);
              if (id(${prefix_id}calibrating)) {
                id(${prefix_id}calibrating_axis_y_min) = min(id(${prefix_id}calibrating_axis_y_min), x);
                id(${prefix_id}calibrating_axis_y_max) = max(id(${prefix_id}calibrating_axis_y_max), x);
              }
      filters:
        - delta: ${magnetic_field_update_delta}
    ${axis_z_key}:
      id: ${prefix_id}qmc5883l_axis_z
      name: ${prefix_name}Magnetic Field Strength Z
      internal: ${hide_magnetic_field_strength_sensors}
      entity_category: diagnostic
      on_raw_value:
        then:
          - lambda: |-
              id(${prefix_id}sensor_alive) = true;
              id(${prefix_id}raw_axes)[2] = x;
              if (id(${prefix_id}axis).current_option() == "z") id(${prefix_id}axis_value).publish_state(x);
              if (id(${prefix_id}calibrating)) {
                id(${prefix_id}calibrating_axis_z_min) = min(id(${prefix_id}calibrating_axis_z_min), x);
                id(${prefix_id}calibrating_axis_z_max) = max(id(${prefix_id}calibrating_axis_z_max), x);
                if (id(${prefix_id}cal_n) == 0) {
                  for (int i = 0; i < 3; i++) {
                    id(${prefix_id}cal_origin)[i] = id(${prefix_id}raw_axes)[i];
                    id(${prefix_id}cal_prev)[i] = 0.0f;
                  }
                }
                float d0 = id(${prefix_id}raw_axes)[0] - id(${prefix_id}cal_origin)[0];
                float d1 = id(${prefix_id}raw_axes)[1] - id(${prefix_id}cal_origin)[1];
                float d2 = id(${prefix_id}raw_axes)[2] - id(${prefix_id}cal_origin)[2];
                id(${prefix_id}cal_sum)[0] += d0;
                id(${prefix_id}cal_sum)[1] += d1;
                id(${prefix_id}cal_sum)[2] += d2;
                id(${prefix_id}cal_sum2)[0] += d0 * d0;
                id(${prefix_id}cal_sum2)[1] += d1 * d1;
                id(${prefix_id}cal_sum2)[2] += d2 * d2;
                id(${prefix_id}cal_cross)[0] += d0 * d1;
                id(${prefix_id}cal_cross)[1] += d0 * d2;
                id(${prefix_id}cal_cross)[2] += d1 * d2;
                id(${prefix_id}cal_area)[0] += id(${prefix_id}cal_prev)[0] * d1 - d0 * id(${prefix_id}cal_prev)[1];
                id(${prefix_id}cal_area)[1] += id(${prefix_id}cal_prev)[0] * d2 - d0 * id(${prefix_id}cal_prev)[2];
                id(${prefix_id}cal_area)[2] += id(${prefix_id}cal_prev)[1] * d2 - d1 * id(${prefix_id}cal_prev)[2];
                id(${prefix_id}cal_prev)[0] = d0;
                id(${prefix_id}cal_prev)[1] = d1;
                id(${prefix_id}cal_prev)[2] = d2;
                id(${prefix_id}cal_n) += 1;
              }
              if (id(${prefix_id}detection_algorithm).current_option() != "Quadrature") return;
              if (id(${prefix_id}quad_w)[0] == 0.0f && id(${prefix_id}quad_w)[1] == 0.0f &&
                  id(${prefix_id}quad_w)[2] == 0.0f) return;
              auto main_axis = id(${prefix_id}axis).current_option();
              int p = (main_axis == "x") ? 0 : ((main_axis == "y") ? 1 : ((main_axis == "z") ? 2 : -1));
              if (p < 0) return;

              // 1. Update per-axis Adaptive Min/Max Trackers and normalize all 3 axes to [-1, +1]
              float u[3];
              for (int i = 0; i < 3; i++) {
                float val = id(${prefix_id}raw_axes)[i];
                float span_cfg = id(${prefix_id}quad_span)[i];
                if (std::isnan(span_cfg) || span_cfg < 1.0f) span_cfg = id(${prefix_id}magnet_span).state;
                float &tmax = id(${prefix_id}quad_trk_max)[i];
                float &tmin = id(${prefix_id}quad_trk_min)[i];
                if (std::isnan(tmax) || std::isnan(tmin)) {
                  tmax = val + span_cfg / 2.0f;
                  tmin = val - span_cfg / 2.0f;
                }
                float axis_decay = ${tracker_decay_rate} * (span_cfg / 40.0f);
                tmax -= axis_decay;
                tmin += axis_decay;
                float max_allowed = span_cfg * ${max_span_multiplier};
                if (val > tmax) {
                  tmax = val;
                  if ((tmax - tmin) > max_allowed) tmin = tmax - max_allowed;
                }
                if (val < tmin) {
                  tmin = val;
                  if ((tmax - tmin) > max_allowed) tmax = tmin + max_allowed;
                }
                float min_span = span_cfg * ${min_span_multiplier};
                float cur_span = tmax - tmin;
                if (cur_span < min_span) {
                  float corr = (min_span - cur_span) / 2.0f;
                  tmax += corr;
                  tmin -= corr;
                }
                u[i] = 2.0f * (val - (tmax + tmin) / 2.0f) / (tmax - tmin);
              }
              id(${prefix_id}track_max) = id(${prefix_id}quad_trk_max)[p];
              id(${prefix_id}track_min) = id(${prefix_id}quad_trk_min)[p];

              // 2. Project all 3 normalized axes onto the orthogonal (I = cos, Q = sin) plane
              float q_val = 0.0f;
              for (int i = 0; i < 3; i++) {
                if (i != p) {
                  q_val += id(${prefix_id}quad_w)[i] * (u[i] - id(${prefix_id}quad_c)[i] * u[p]);
                }
              }
              float i_val = 0.0f;
              for (int i = 0; i < 3; i++) {
                i_val += id(${prefix_id}quad_wi)[i] * (u[i] - id(${prefix_id}quad_s)[i] * q_val);
              }

              // 3. 4-state Gray-code Schmitt-trigger decoder on the orthogonalized (I, Q) circle
              if (i_val > 0.35f) {
                id(${prefix_id}quad_i_high) = true;
              } else if (i_val < -0.35f) {
                id(${prefix_id}quad_i_high) = false;
              }
              if (q_val > 0.35f) {
                id(${prefix_id}quad_q_high) = true;
              } else if (q_val < -0.35f) {
                id(${prefix_id}quad_q_high) = false;
              }
              int phase = id(${prefix_id}quad_i_high)
                  ? (id(${prefix_id}quad_q_high) ? 1 : 0)
                  : (id(${prefix_id}quad_q_high) ? 2 : 3);
              if (id(${prefix_id}quad_state) < 0) {
                id(${prefix_id}quad_state) = phase;
                id(${prefix_id}quad_net_max) =
                    (long) id(${prefix_id}half_rotations_total) * 4L + id(${prefix_id}quad_steps);
                for (int i = 0; i < 4; i++) id(${prefix_id}quad_t)[i] = 0;
                return;
              }
              int diff = (phase - id(${prefix_id}quad_state)) & 3;
              if (diff == 0) return;
              id(${prefix_id}quad_state) = phase;
              if (diff == 2) return;
              int step = (diff == 1) ? 1 : -1;
              id(${prefix_id}quad_steps) += step;
              if (id(${prefix_id}quad_i_high)) {
                id(led).turn_on();
              } else {
                id(led).turn_off();
              }

              // Commit full forward or reverse cycles (4 quadrature steps = 1 half-rotation count)
              if (id(${prefix_id}quad_steps) >= 4) {
                id(${prefix_id}quad_steps) -= 4;
                id(${prefix_id}half_rotations_total) += 1;
              } else if (id(${prefix_id}quad_steps) <= -4) {
                id(${prefix_id}quad_steps) += 4;
                id(${prefix_id}half_rotations_total) -= 1;
                id(${prefix_id}quad_reverse_total) += 1;
              }

              long net_q = (long) id(${prefix_id}half_rotations_total) * 4L + id(${prefix_id}quad_steps);
              if (net_q > id(${prefix_id}quad_net_max)) {
                id(${prefix_id}quad_net_max) = net_q;
                if (id(${prefix_id}flow_direction).state != "Forward") {
                  id(${prefix_id}flow_direction).publish_state("Forward");
                }
                uint32_t now_ms = millis();
                int q_idx = (int) (net_q & 3L);
                uint32_t t4 = id(${prefix_id}quad_t)[q_idx];
                if (id(${prefix_id}last_pulse_ms) != 0) {
                  uint32_t dt_step = now_ms - id(${prefix_id}last_pulse_ms);
                  if (dt_step >= 3) {
                    if (dt_step > ${max_silence_seconds} * 1000UL) {
                      for (int i = 0; i < 4; i++) id(${prefix_id}quad_t)[i] = 0;
                      id(${prefix_id}iv1) = 0;
                      id(${prefix_id}iv2) = 0;
                      id(${prefix_id}iv0) = dt_step * 4;
                    } else {
                      // Use the full 4-step (half-rotation) period once 4 steps have
                      // accumulated in the current session so quadrant asymmetry cancels out.
                      uint32_t dt = (t4 != 0) ? (now_ms - t4) : (dt_step * 4);
                      id(${prefix_id}iv2) = id(${prefix_id}iv1);
                      id(${prefix_id}iv1) = id(${prefix_id}iv0);
                      id(${prefix_id}iv0) = dt;
                    }
                  }
                }
                id(${prefix_id}quad_t)[q_idx] = now_ms;
                id(${prefix_id}last_pulse_ms) = now_ms;
              } else if (id(${prefix_id}quad_net_max) - net_q >= 2) {
                if (id(${prefix_id}flow_direction).state != "Reverse") {
                  id(${prefix_id}flow_direction).publish_state("Reverse");
                }
              }
      filters:
        - delta: ${magnetic_field_update_delta}
    temperature:
      id: ${prefix_id}qmc5883l_temperature
      name: ${prefix_name}Temperature
      filters:
        - lambda: "return x + id(${prefix_id}temperature_offset).state;"
        - sliding_window_moving_average:
            window_size: 3000
            send_every: 3000
        - or:
            - throttle: 300s
            - delta: 0.5
    oversampling: ${qmc5883l_oversampling}
    update_interval: ${qmc5883l_update_interval}

  - platform: template
    id: ${prefix_id}sensor_track_min
    name: ${prefix_name}Track Min
    lambda: return id(${prefix_id}track_min);
    update_interval: 1s
    internal: ${hide_magnetic_field_strength_sensors}
    entity_category: diagnostic
    accuracy_decimals: 1
    unit_of_measurement: µT
    icon: mdi:arrow-collapse-down
    filters:
      - delta: ${magnetic_field_update_delta}

  - platform: template
    id: ${prefix_id}sensor_track_max
    name: ${prefix_name}Track Max
    lambda: return id(${prefix_id}track_max);
    update_interval: 1s
    internal: ${hide_magnetic_field_strength_sensors}
    entity_category: diagnostic
    accuracy_decimals: 1
    unit_of_measurement: µT
    icon: mdi:arrow-collapse-up
    filters:
      - delta: ${magnetic_field_update_delta}

  - platform: template
    id: ${prefix_id}sensor_half_rotations_total
    name: ${prefix_name}Half rotations total
    lambda: return id(${prefix_id}half_rotations_total);
    update_interval: 1s
    internal: ${hide_half_rotations_total_sensor}
    entity_category: diagnostic
    accuracy_decimals: 0
    state_class: 'total_increasing'
    icon: 'mdi:counter'
    filters:
      - delta: 0

  - platform: template
    id: ${prefix_id}sensor_quad_reverse_total
    name: ${prefix_name}Reverse counts total
    lambda: return id(${prefix_id}quad_reverse_total);
    update_interval: 1s
    internal: ${hide_half_rotations_total_sensor}
    entity_category: diagnostic
    accuracy_decimals: 0
    state_class: 'total_increasing'
    icon: 'mdi:counter'
    filters:
      - delta: 0

  - platform: template
    id: ${prefix_id}sensor_total
    name: ${prefix_name}Total
    lambda: |-
      bool failed = id(${prefix_id}qmc5883l_id).is_failed() || !id(${prefix_id}sensor_alive);
      id(${prefix_id}magnetometer_problem).publish_state(failed);
      if (failed) {
        ESP_LOGW("${prefix_id}recovery", "Magnetometer not responding, attempting recovery...");
        if (id(${prefix_id}qmc5883l_id).is_failed()) {
          id(${prefix_id}qmc5883l_id).reset_to_construction_state();
          id(${prefix_id}qmc5883l_id).call();
        } else {
          id(${prefix_id}qmc5883l_id).call_setup();
        }
      }
      id(${prefix_id}sensor_alive) = false;
      float current = id(${prefix_id}half_rotations_total) * id(${prefix_id}volume_per_half_rotation).state
                      + id(${prefix_id}volume_offset);
      // Total is total_increasing: Home Assistant treats a decrease as a meter reset
      // and adds the entire register as phantom consumption. Hold the high-water mark
      // when reverse ticks occur in Quadrature mode until forward flow catches back up.
      if (std::isnan(id(${prefix_id}quad_total_max)) || current > id(${prefix_id}quad_total_max)) {
        id(${prefix_id}quad_total_max) = current;
      }
      return id(${prefix_id}quad_total_max);
    update_interval: 10s
    accuracy_decimals: 2
    device_class: ${device_class}
    icon: ${device_icon}
    state_class: total_increasing
    unit_of_measurement: ${volume_unit}
    filters:
      - or:
          - throttle: 60s
          - delta: 0

  - platform: template
    id: ${prefix_id}sensor_flow
    name: ${prefix_name}Flow
    device_class: volume_flow_rate
    icon: mdi:speedometer
    lambda: |-
      const float vol = id(${prefix_id}volume_per_half_rotation).state;

      // Rate from the median time between half rotations. Counting pulses in a fixed
      // window cannot express a rate below one count per window, and on a coarse gas
      // index, where one count can be worth a couple of ft3, that floor sits above
      // the steady draw of every residential appliance.
      if (id(${prefix_id}last_pulse_ms) == 0 || id(${prefix_id}iv0) == 0) {
        if (id(${prefix_id}flow_direction).state != "Stopped") {
          id(${prefix_id}flow_direction).publish_state("Stopped");
        }
        return 0.0f;
      }

      // Median of up to 3 intervals. A spurious edge splits one real interval into a
      // very short and a near-normal one, and the median discards the short one. It
      // also treats the long gap after an idle period as an outlier, so the first
      // pulse of a new session does not drag the rate down. Written without min/max
      // because Arduino cores define those as function-like macros.
      uint32_t floor_ms = ${min_silence_seconds} * 1000UL;
      uint32_t ceil_ms = ${max_silence_seconds} * 1000UL;
      bool quad_active = id(${prefix_id}detection_algorithm).current_option() == "Quadrature" &&
                         (id(${prefix_id}quad_w)[0] != 0.0f ||
                          id(${prefix_id}quad_w)[1] != 0.0f ||
                          id(${prefix_id}quad_w)[2] != 0.0f);
      uint32_t step_scale = quad_active ? 4UL : 1UL;

      uint32_t a = id(${prefix_id}iv0), b = id(${prefix_id}iv1), c = id(${prefix_id}iv2);
      uint32_t med;
      if (b == 0) {
        med = a;
      } else if (c == 0) {
        // An interval longer than ceil_ms * step_scale can only be a session-start gap
        // (any such gap resets the buffer above), never a real in-session interval.
        // Averaging it in would drag the first minutes of a new burn/draw down to near
        // zero, so with only two samples the older one is dropped rather than averaged.
        med = (b > ceil_ms * step_scale) ? a : (a + b) / 2;
      } else {
        uint32_t lo = (a < b) ? a : b;
        uint32_t hi = (a < b) ? b : a;
        med = (c < lo) ? lo : ((c > hi) ? hi : c);
      }

      // Silence allowed before Flow reads zero. The floor stops a sharp deceleration
      // (shower throttled to a trickle) being mistaken for a stop; the ceiling bounds
      // how long Flow lingers so automations keyed on zero still fire. In Quadrature
      // mode, pulses arrive every quarter-cycle (med / 4).
      uint32_t timeout = (uint32_t)(2.5f * (med / step_scale));
      if (timeout < floor_ms) timeout = floor_ms;
      if (timeout > ceil_ms) timeout = ceil_ms;

      // Display decision only: report zero when silent, but never clear the interval
      // buffer. Intervals longer than the timeout are still measured, so a slow leak
      // keeps reporting its real rate instead of being stuck at zero forever.
      uint32_t elapsed = millis() - id(${prefix_id}last_pulse_ms);
      if (elapsed > timeout) {
        if (id(${prefix_id}flow_direction).state != "Stopped") {
          id(${prefix_id}flow_direction).publish_state("Stopped");
        }
        return 0.0f;
      }

      // While silent, the true rate cannot exceed one pulse (or quarter-pulse in
      // Quadrature mode) per elapsed time, so the reading decays along that bound
      // instead of holding a stale higher value.
      float rate = vol * 60000.0f / med;
      uint32_t scaled_elapsed = (elapsed > 0 ? elapsed : 1) * step_scale;
      float bound = vol * 60000.0f / scaled_elapsed;
      return (rate < bound) ? rate : bound;
    update_interval: ${flow_update_interval_seconds}s
    accuracy_decimals: ${flow_accuracy_decimals}
    state_class: measurement
    unit_of_measurement: ${volume_unit}/min
    filters:
      - or:
          - throttle: 60s
          - delta: 0
