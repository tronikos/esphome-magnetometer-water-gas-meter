---
substitutions:
  # Scale per-sample decay for 12ms polling (~2.4x 5ms) so drift tracking stays ~6 µT/min.
  tracker_decay_rate: '0.0012'
logger:
  logs:
    mmc5603: INFO
number:
  - id: !remove ${prefix_id}temperature_offset
sensor:
  - id: !extend ${prefix_id}qmc5883l_id
    platform: mmc5603
    address: 0x30
    oversampling: !remove
    # ESPHome's mmc5603 driver issues 11 separate 1-byte I2C transfers per poll (~10 ms
    # at 50 kHz); polling faster pegs the I2C bus continuously with no loop headroom.
    update_interval: 12ms
