---
external_components:
  # Temporarily use fork with ESPHome 2026.11+ fix until
  # https://github.com/mazzhead/esphome-components/pull/4 is merged.
  - source: github://tronikos/esphome-qmc5883p@0f912c9eac7365e40ecb15a1630a5946a28a5dd2
    components: [qmc5883p]

logger:
  logs:
    qmc5883p: INFO
number:
  - id: !remove ${prefix_id}temperature_offset
sensor:
  - id: !extend ${prefix_id}qmc5883l_id
    platform: qmc5883p
    address: 0x2C
    mode: 1
    oversampling: 1x
    noise_level: 1x
